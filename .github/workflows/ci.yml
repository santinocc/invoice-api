name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres for the integration tests in internal/postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice # CI only, not a real secret
          POSTGRES_DB: invoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://invoice:invoice@localhost:5432/invoice_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Load the database schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - name: Test
        run: go test -race -v ./... 2>&1 | tee test.log; test ${PIPESTATUS[0]} -eq 0
      - name: Fail if the Postgres tests were skipped
        run: "! grep -q -- '--- SKIP' test.log"
